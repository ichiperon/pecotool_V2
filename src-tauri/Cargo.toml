[package]
name = "tauri-app"
version = "2.0.24"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# PCT-201: devtools feature は既定で無効。`npm run tauri dev`（package.json 側）が
# `--features devtools` を明示的に渡した時のみ有効になる。`npm run tauri build`（release）は
# 何も渡さないため無効のまま。Cargo は debug_assertions ベースの依存切り替えを
# サポートしない（`[target.'cfg(debug_assertions)'.dependencies]` は無効な構文）ため、
# 自前 feature + フロント側の呼び分けで代替する。
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
# PCT-184: ダイアログ由来の runtime fs scope をディスクへ永続化し、アプリ再起動後も維持する。
tauri-plugin-persisted-scope = "2.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time"] }
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
